<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EdgeStudios</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #222;
      border-radius: 16px;
      background: #111;
    }
    .dot {
      width: 12px; height: 12px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 0.5rem; }
    p { color: #888; font-size: 1rem; margin-top: 0.75rem; }
    .status { display: flex; align-items: center; justify-content: center; margin-top: 1.5rem; font-size: 0.875rem; color: #22c55e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>EdgeStudios</h1>
    <p>Deployment pipeline test — all systems operational.</p>
    <div class="status"><span class="dot"></span> Live on edgestudios.co.za</div>
  </div>
</body>
</html>
