name: Build Reps APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        # The runner image ships the SDK and cmdline-tools; just make sure the exact platform/build-tools exist.
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        # Signed with the real key when the REPS_KEYSTORE_* secrets are set, otherwise with a debug key.
        env:
          REPS_KEYSTORE_B64: ${{ secrets.REPS_KEYSTORE_B64 }}
          REPS_KEYSTORE_PASSWORD: ${{ secrets.REPS_KEYSTORE_PASSWORD }}
          REPS_KEY_ALIAS: ${{ secrets.REPS_KEY_ALIAS }}
          REPS_KEY_PASSWORD: ${{ secrets.REPS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reps-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Reps (latest build)
          body: "Latest release APK from the most recent push. Download app-release.apk and install it on your phone."
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: false
          make_latest: true
